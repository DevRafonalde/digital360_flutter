# Ambiente de homologacao: Oracle Free + back-end Spring Boot.
# E o mesmo arquivo no pipeline e na maquina do desenvolvedor.
name: smarthas-homolog

services:
  oracle:
    image: gvenzl/oracle-free:slim-faststart
    environment:
      ORACLE_PASSWORD: ${ORACLE_ADMIN_PASSWORD:-Fiap2026}
      APP_USER: ${ORACLE_USER:-smarthas}
      APP_USER_PASSWORD: ${ORACLE_PASSWORD:-smarthas}
    ports:
      - "1521:1521"
    volumes:
      - ../database-oracle:/work:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60

  api:
    image: ${SMARTHAS_IMAGE:-smarthas-backend:local}
    build: ../backend-java
    environment:
      ORACLE_ENABLED: "true"
      ORACLE_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
      ORACLE_USER: ${ORACLE_USER:-smarthas}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-smarthas}
      JWT_SECRET: ${JWT_SECRET:-smarthas-homologacao-local-troque-no-pipeline-0102030405}
    ports:
      - "8080:8080"
    depends_on:
      oracle:
        condition: service_healthy
