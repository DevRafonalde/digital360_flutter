org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G
# Desligado porque o Gradle Daemon usa uma conexao de loopback TCP (socket
# local) pra comunicacao entre o processo cliente e o daemon em background -
# nesta maquina, o firewall/antivirus corporativo bloqueia essa conexao com
# "Unable to establish loopback connection". Sem daemon, cada build roda num
# processo novo sem precisar dessa IPC via socket, contornando o bloqueio -
# ao custo de builds um pouco mais lentos (sem cache do daemon entre builds).
org.gradle.daemon=false
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
