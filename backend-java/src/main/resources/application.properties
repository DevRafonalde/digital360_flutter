spring.application.name=smarthas-backend
server.port=8080

# H2 em arquivo (persiste entre reinicializacoes, sem depender de servidor externo)
spring.datasource.url=jdbc:h2:file:./data/smarthas;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT (segredo local de demonstracao - trocar em producao via variavel de ambiente)
smarthas.jwt.secret=${JWT_SECRET:smarthas-fiap-fase5-super-secreto-troque-em-producao-0102030405}
smarthas.jwt.access-expiration-ms=3600000
smarthas.jwt.refresh-expiration-ms=604800000

# CORS (Angular dashboard em dev)
smarthas.cors.allowed-origins=http://localhost:4200

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
